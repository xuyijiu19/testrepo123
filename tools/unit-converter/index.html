<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Converter &mdash; Web Tools & Learning Portal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="../../shared/styles.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="tool-page">
    <a class="back-link" href="../../index.html">&larr; Back to all tools</a>
    <h1>Unit Converter</h1>
    <p>Convert between length, weight, and temperature units.</p>

    <div class="field">
      <label for="category">Category</label>
      <select id="category">
        <option value="length">Length</option>
        <option value="weight">Weight</option>
        <option value="temperature">Temperature</option>
      </select>
    </div>

    <div class="field">
      <label for="input-value">Value</label>
      <input type="number" id="input-value" value="1">
    </div>

    <div class="field">
      <label for="from-unit">From</label>
      <select id="from-unit"></select>
    </div>

    <div class="field">
      <label for="to-unit">To</label>
      <select id="to-unit"></select>
    </div>

    <div class="result" id="result">&mdash;</div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
